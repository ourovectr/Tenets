name: Import Existing Assets - Producer

on:
  workflow_dispatch:

concurrency:
  group: concrete-horizons-producer
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests pyyaml

      - name: Import Historical Assets
        run: python import_existing_assets.py --config config/producer.yml
        env:
          FB_PRODUCER_PAGE_ID:    ${{ secrets.FB_PRODUCER_PAGE_ID }}
          FB_PRODUCER_PAGE_TOKEN: ${{ secrets.FB_PRODUCER_PAGE_TOKEN }}

      - name: Save to Producer Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets_producer.json metrics_cache_producer.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: import producer historical assets to JSON [skip ci]"
            git pull origin main --rebase
            git push origin HEAD:main
          else
            echo "No new producer assets found."
          fi
