name: Concrete Horizons Analytics — Viral

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: concrete-horizons-viral
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install requests pyyaml

      - name: Run Analytics
        run: python analytics.py --config config/viral.yml
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}

      - name: Commit Analytics Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics_history.csv || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update viral analytics snapshot [skip ci]"
            git pull origin main --rebase
            git push origin HEAD:main
          else
            echo "No analytics changes to commit."
          fi
